<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#141c26"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="16" fill="#18202a"/>
  
  <!-- Subtle border for crisp contrast in dark and light browser chrome -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Chromatic aberration cyan offset layer -->
  <text x="31" y="47.5" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="46" font-weight="800" text-anchor="middle" fill="#00d4ff" opacity="0.85">L</text>
  
  <!-- Chromatic aberration amber / gold offset layer -->
  <text x="33.5" y="48.5" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="46" font-weight="800" text-anchor="middle" fill="#d97706" opacity="0.85">L</text>
  
  <!-- Main white letter -->
  <text x="32" y="48" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="46" font-weight="800" text-anchor="middle" fill="#ffffff">L</text>
</svg>
